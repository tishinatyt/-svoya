    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="shortcut icon" href="%BASE_URL%favicon.ico?v=svoya-20261006" />

    <link rel="manifest" href="%BASE_URL%manifest.webmanifest?v=svoya-20261006" />
    <link rel="canonical" href="https://tishinatyt.github.io/-svoya/" />
    <script>
      // Restore legacy or fallback deep links within this project only.
      (function () {
        var base = '%BASE_URL%';
        var params = new URLSearchParams(location.search);
        var redirect = params.get('__svoya_route');
        try {
          redirect = redirect || sessionStorage.getItem('svoya:redirect');
          sessionStorage.removeItem('svoya:redirect');
        } catch (_) {}
        if (!redirect) return;
        try {
          var target = new URL(redirect, location.origin);
          if (target.origin === location.origin && target.pathname.startsWith(base)) {
            history.replaceState(null, '', target.pathname + target.search + target.hash);
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
