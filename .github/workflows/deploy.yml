name: SVOYA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /startai/svoya/

      - name: Upload deployable dist
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: svoya-pages-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
